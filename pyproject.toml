[project]
name = "comfyui-kreareason"
description = "Reason-then-encode for Krea 2. The encoder's own Qwen3-VL rewrites your prompt into a richer one — or reads a reference image (describe → filter → combine) — before conditioning: a built-in prompt enhancer and language-level image reference, running on the exact model that conditions."
version = "1.0.0"
license = "MIT"
authors = [
    { name = "Peter Neill" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/shootthesound/ComfyUI-KreaReason"
Repository = "https://github.com/shootthesound/ComfyUI-KreaReason"
Issues = "https://github.com/shootthesound/ComfyUI-KreaReason/issues"

[tool.comfy]
PublisherId = "shootthesound"
DisplayName = "Krea Reason"
Icon = ""
